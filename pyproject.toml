[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-reliability-framework"
version = "1.0.0"
description = "pytest-based API test automation framework with PostgreSQL validation, failure classification, and reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sahil Bhatti" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "email-validator>=2.1,<3.0",
    "PyYAML>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
    "pytest>=8.0,<9.0",
    "pytest-html>=4.0,<5.0",
    "tenacity>=8.4,<10.0",
    "jinja2>=3.1,<4.0",
    "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0"
]

[tool.setuptools.packages.find]
include = ["runner*", "mock_service*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
