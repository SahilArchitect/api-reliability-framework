services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-api:
    build: .
    command: uvicorn mock_service.app.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql://app:app@postgres:5432/app
      AUTH_TOKEN: local-secret-token
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-runner:
    build: .
    command: python -m runner run --suite smoke --env configs/env.docker.yaml --reports-dir reports
    environment:
      PYTHONPATH: /app
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy
