name: API Reliability Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start API test environment
        run: docker compose up --build -d postgres mock-api

      - name: Run unit tests
        run: pytest tests

      - name: Run smoke API suite
        run: python -m runner run --suite smoke --env configs/env.local.yaml --reports-dir reports

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reliability-reports
          path: reports/
